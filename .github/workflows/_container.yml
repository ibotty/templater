---
name: build-container
on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      containerfile:
        type: string
        required: true
      artifact:
        type: string
        default: ''
        description: Optional artifact to restore into target/release before building.
      archs:
        type: string
        default: amd64

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push ${{ inputs.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - if: ${{ inputs.artifact != '' }}
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: target/release

    # upload-artifact drops the executable bit; restore it before COPY.
    - if: ${{ inputs.artifact != '' }}
      run: chmod +x target/release/*

    - name: Log into registry
      uses: redhat-actions/podman-login@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Set up qemu for multi-arch
      if: ${{ inputs.archs != 'amd64' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static

    - name: Build container
      id: build-image
      uses: redhat-actions/buildah-build@v2
      with:
        image: ${{ inputs.image }}
        tags: "latest"
        archs: ${{ inputs.archs }}
        oci: true
        containerfiles: ${{ inputs.containerfile }}

    - name: Push to registry
      uses: redhat-actions/push-to-registry@v2
      with:
        image: ${{ steps.build-image.outputs.image }}
        tags: ${{ steps.build-image.outputs.tags }}
        registry: ${{ env.REGISTRY }}
