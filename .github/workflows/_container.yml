---
name: build-container
on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      containerfile:
        type: string
        required: true
      artifact:
        type: string
        default: ''
        description: Optional artifact to restore into target/release before building.
      archs:
        type: string
        default: amd64

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build:
    name: Build and push ${{ inputs.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - if: ${{ inputs.artifact != '' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact }}
        path: target/release

    # upload-artifact drops the executable bit; restore it before COPY.
    - if: ${{ inputs.artifact != '' }}
      run: chmod +x target/release/*

    - name: Log into registry
      uses: redhat-actions/podman-login@4c93cb1ea36b10156ea541570dc69bc04dffe10e # v1.1.2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Set up qemu for multi-arch
      if: ${{ inputs.archs != 'amd64' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static

    - name: Build container
      id: build-image
      uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
      with:
        image: ${{ inputs.image }}
        tags: "latest"
        archs: ${{ inputs.archs }}
        oci: true
        containerfiles: ${{ inputs.containerfile }}

    - name: Push to registry
      uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
      with:
        image: ${{ steps.build-image.outputs.image }}
        tags: ${{ steps.build-image.outputs.tags }}
        registry: ${{ env.REGISTRY }}
